name: Publish release

on:
  workflow_run:
    workflows: [Python checks]
    types: [completed]
    branches: [main]

permissions:
  contents: read

# Serialize attempts; never cancel a release while its assets are uploading.
concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Check out the tested main commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Check release version, notes and existing tags
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/release.py
      - name: Build distributions
        if: steps.release.outputs.publish == 'true'
        run: |
          python -m pip install build
          python -m build
          sha256sum dist/* > dist/SHA256SUMS
      - name: Publish release with distributions
        if: steps.release.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_NOTES: ${{ steps.release.outputs.notes }}
        run: |
          gh release create "$RELEASE_TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$TESTED_SHA" \
            --title "Beam Weaver $RELEASE_TAG" \
            --notes-file "$RELEASE_NOTES" \
            --latest
